<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c4a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Πορτοφόλι Εγγράφων</title>
<style>
:root{--navy:#0c4a4f;--blue:#0f8b8d;--bg:#f2f5fa;--card:#fff;--ink:#14213d;--mute:#6b7894;--line:#e1e7f1;--red:#c62828;--amber:#b26a00;--green:#1b7f45;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
header.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;position:sticky;top:0;z-index:5}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:19px;margin:0;font-weight:700}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-size:15px}
.search{margin-top:12px;width:100%;border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:rgba(255,255,255,.95)}
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.doc{border-radius:var(--r);padding:16px 18px;color:#fff;margin-bottom:14px;box-shadow:0 6px 18px rgba(12,74,79,.2);position:relative;overflow:hidden;cursor:pointer}
.doc::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.09)}
.doc .t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.doc .n{font-size:19px;font-weight:700;margin:4px 0 12px}
.doc .h{font-size:14px;opacity:.95}
.doc .num{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.08em;margin-top:2px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:10px}
.badge.bad{background:#ffdede;color:var(--red)}.badge.warn{background:#ffefcf;color:var(--amber)}
.empty{text-align:center;color:var(--mute);margin-top:60px;line-height:1.6}
.empty .big{font-size:54px}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:0;border-radius:99px;padding:15px 26px;font-weight:700;font-size:16px;box-shadow:0 8px 22px rgba(15,139,141,.4)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;max-width:560px;margin:0 auto}
.sheet .body{padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;margin-top:18px}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1c5c5}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgslot{aspect-ratio:1.58;border:2px dashed #9ccaca;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;text-align:center;background:#fff;background-size:cover;background-position:center;position:relative;cursor:pointer}
.imgslot.has{border-style:solid;border-color:var(--line);color:transparent}
.imgslot .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:99px;width:24px;height:24px;line-height:22px;padding:0;font-size:14px}
.kv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.kv small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.kv div{font-size:16px;word-break:break-word}
.lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0a3a3e,#0f8b8d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock h2{margin:8px 0 4px}.lock p{opacity:.85;margin:0 0 22px;font-size:14px;max-width:300px}
.dots{display:flex;gap:12px;margin-bottom:22px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:26px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.35)}
.err{color:#ffd0d0;min-height:20px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:99}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:24px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.alert{background:#fff4de;border:1px solid #f3d9a4;color:#7a4b00;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.flip{perspective:1000px;margin-top:14px;cursor:pointer}
.flip .fi{position:relative;aspect-ratio:1.58;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:14px;background-size:cover;background-position:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.flip .face.back{transform:rotateY(180deg)}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.biobtn{margin-top:22px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:12px 22px;font-size:15px}
.ahero{border-radius:var(--r);background:linear-gradient(180deg,#2a9d8f 0,#2a9d8f 34%,#101a3d 34%);color:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(12,74,79,.25);margin-bottom:6px}
.ahero .top2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 18px 0;min-height:150px}
.ahero small{opacity:.85;font-size:13px;display:block}
.ahero .big{font-size:30px;font-weight:700;letter-spacing:.02em;word-break:break-all;margin:4px 0}
.ahero .pic{width:42%;max-width:190px;aspect-ratio:3/4;border-radius:16px;background:#fff center/cover;margin-bottom:-36px;box-shadow:0 8px 20px rgba(0,0,0,.25);flex:none}
.ahero .flds{padding:48px 18px 8px}
.ahero .af{border-bottom:1px solid rgba(255,255,255,.25);padding:12px 0}
.ahero .af small{text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.ahero .af div{font-size:24px;font-weight:600;text-transform:uppercase;margin-top:2px;word-break:break-word}
.ahero .bd{padding:0 18px 16px}
.doc .thumb{position:absolute;right:16px;bottom:14px;width:56px;height:72px;border-radius:10px;background:#fff center/cover;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const ITER = 310000;
const TYPES = {
  id:       {n:'Ταυτότητα',      g:['#0f8b8d','#0a4448']},
  license:  {n:'Δίπλωμα οδήγησης', g:['#0e8a6b','#075a46']},
  passport: {n:'Διαβατήριο',     g:['#6a2bb8','#3d1a70']},
  amka:     {n:'ΑΜΚΑ / Υγεία',   g:['#d6336c','#8f1f48']},
  afm:      {n:'ΑΦΜ / Εφορία',   g:['#2b7cb8','#154c75']},
  insurance:{n:'Ασφάλεια',       g:['#e8590c','#9c3d08']},
  academic: {n:'Φοιτητικό / Ακαδημαϊκό', g:['#2a9d8f','#101a3d']},
  other:    {n:'Άλλο έγγραφο',   g:['#495c7a','#26334a']}
};
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
const uid = () => crypto.randomUUID();

/* ---------- storage (IndexedDB) ---------- */
const DB = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('docwallet',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async clear(){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').clear(); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
};

/* ---------- crypto ---------- */
async function deriveKey(pin, salt, iter=ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {iv, data};
}
async function decryptJSON(key, blob){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:blob.iv}, key, blob.data);
  return JSON.parse(dec.decode(buf));
}
const toB64 = buf => { const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = b => Uint8Array.from(atob(b), c=>c.charCodeAt(0));

const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const newMaster = () => crypto.subtle.generateKey({name:'AES-GCM',length:256}, true, ['encrypt','decrypt']);
async function wrapKey(wk, master){ const raw=await crypto.subtle.exportKey('raw',master); const iv=rnd(12); return {iv, data: await crypto.subtle.encrypt({name:'AES-GCM',iv}, wk, raw)}; }
async function unwrapKey(wk, w){ const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:w.iv}, wk, w.data); return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']); }
const prfKey = out => crypto.subtle.importKey('raw', out, {name:'AES-GCM'}, false, ['encrypt','decrypt']);

/* ---------- state ---------- */
let KEY=null, DOCS=[], PROFILES=['Εγώ'], META=null, lastActive=Date.now(), revealed=new Set();
async function persist(){ const blob = await encryptJSON(KEY, {docs:DOCS, profiles:PROFILES}); await DB.set('vault', blob); }
function loadVault(v){ DOCS=v.docs||[]; PROFILES=(v.profiles&&v.profiles.length)?v.profiles:['Εγώ']; }

/* ---------- biometrics (WebAuthn PRF) ---------- */
async function bioGet(credId, prfSalt){
  const a = await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:'public-key',id:credId}], userVerification:'required', extensions:{prf:{eval:{first:prfSalt}}}}});
  return a.getClientExtensionResults().prf?.results?.first;
}
async function bioEnable(){
  if(!window.PublicKeyCredential || !navigator.credentials) throw new Error('unsupported');
  const prfSalt=rnd(32);
  const cred = await navigator.credentials.create({publicKey:{challenge:rnd(32), rp:{name:'Πορτοφόλι Εγγράφων'}, user:{id:rnd(16),name:'wallet',displayName:'Πορτοφόλι'}, pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'}, extensions:{prf:{eval:{first:prfSalt}}}}});
  let out = cred.getClientExtensionResults().prf?.results?.first || await bioGet(cred.rawId, prfSalt);
  if(!out) throw new Error('noprf');
  META.bio={credId:cred.rawId, prfSalt, wrapped: await wrapKey(await prfKey(out), KEY)};
  await DB.set('meta',META);
}
async function bioUnlockKey(){
  const out = await bioGet(META.bio.credId, META.bio.prfSalt);
  if(!out) throw new Error('noprf');
  return unwrapKey(await prfKey(out), META.bio.wrapped);
}

/* ---------- lock screen ---------- */
function lockScreen(mode){ // 'setup' | 'confirm' | 'unlock'
  return new Promise(resolve=>{
    let pin='', first=null, step = mode==='setup' ? 'set' : 'unlock';
    const el=document.createElement('div'); el.className='lock';
    const titles = {set:['Δημιουργία PIN','Διάλεξε 6ψήφιο PIN. Κρυπτογραφεί τα έγγραφά σου στη συσκευή. Αν το ξεχάσεις, δεν γίνεται ανάκτηση.'],confirm:['Επιβεβαίωση PIN','Πληκτρολόγησε ξανά το PIN.'],unlock:['Πορτοφόλι Εγγράφων','Πληκτρολόγησε το PIN σου.']};
    function draw(err=''){
      const [t,p]=titles[step];
      el.innerHTML=`<div style="font-size:46px">🪪</div><h2>${t}</h2><p>${p}</p><div class="dots">${[0,1,2,3,4,5].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div><div class="err">${esc(err)}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" style="font-size:18px">⌫</button><button data-k="0">0</button><button style="visibility:hidden"></button></div>${step==='unlock'&&META?.bio?'<button class="biobtn" data-bio="1">🔓 Face ID / Δακτυλικό</button>':''}`;
    }
    async function done(){
      if(step==='set'){ first=pin; pin=''; step='confirm'; draw(); return; }
      if(step==='confirm'){
        if(pin!==first){ pin=''; first=null; step='set'; draw('Τα PIN δεν ταιριάζουν. Ξανά.'); return; }
        const salt=rnd(16); const pk=await deriveKey(pin,salt); KEY=await newMaster(); DOCS=[]; PROFILES=['Εγώ'];
        META={salt,iter:ITER,wrapped:await wrapKey(pk,KEY)};
        await DB.set('meta',META); await persist(); el.remove(); resolve(); return;
      }
      // unlock
      try{
        const pk=await deriveKey(pin, META.salt, META.iter);
        if(META.wrapped){
          const m=await unwrapKey(pk, META.wrapped); loadVault(await decryptJSON(m, await DB.get('vault'))); KEY=m;
        } else { // παλιά μορφή: αναβάθμιση
          loadVault(await decryptJSON(pk, await DB.get('vault'))); KEY=await newMaster(); META.wrapped=await wrapKey(pk,KEY); await DB.set('meta',META); await persist();
        }
        el.remove(); resolve();
      }catch(e){ pin=''; draw('Λάθος PIN'); }
    }
    el.addEventListener('click',e=>{
      const b=e.target.closest('button');
      if(b?.dataset.bio){ bioUnlockKey().then(async m=>{ loadVault(await decryptJSON(m, await DB.get('vault'))); KEY=m; el.remove(); resolve(); }).catch(()=>draw('Η βιομετρική αποτυχία — χρησιμοποίησε το PIN')); return; }
      const k=b?.dataset.k; if(k===undefined) return;
      if(k==='x') pin=pin.slice(0,-1); else if(pin.length<6) pin+=k;
      draw(); if(pin.length===6) setTimeout(done,120);
    });
    draw(); document.body.appendChild(el);
  });
}
function lockNow(){ KEY=null; DOCS=[]; PROFILES=['Εγώ']; revealed.clear(); document.querySelectorAll('.sheet,.modal').forEach(e=>e.remove()); $('#app').innerHTML=''; boot(); }

/* ---------- list view ---------- */
let query='', fProfile='all', fType='all';
function daysLeft(d){ if(!d) return null; return Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5); }
function expiryBadge(d){
  const n=daysLeft(d); if(n===null) return '';
  if(n<0) return `<span class="badge bad">Έληξε</span>`;
  if(n<=60) return `<span class="badge warn">Λήγει σε ${n} ημ.</span>`;
  return `<span class="badge">Ισχύει έως ${new Date(d).toLocaleDateString('el-GR')}</span>`;
}
function maskNum(s){ s=String(s||''); return s.length<=4 ? s : '•••• '+s.slice(-4); }
function renderList(){
  const q=query.trim().toLowerCase();
  const items = DOCS.filter(d=>(fProfile==='all'||(d.profile||PROFILES[0])===fProfile) && (fType==='all'||d.type===fType) && (!q || [d.title,d.holder,d.number,TYPES[d.type]?.n].join(' ').toLowerCase().includes(q)));
  const soon = DOCS.filter(d=>{const n=daysLeft(d.expiry); return n!==null && n<=60;}).sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));
  const usedTypes = [...new Set(DOCS.map(d=>d.type))];
  const chip=(k,v,l,on)=>`<button class="chip ${on?'on':''}" data-${k}="${esc(v)}">${esc(l)}</button>`;
  $('#app').innerHTML=`
  <header class="top"><div class="row"><h1>🪪 Πορτοφόλι Εγγράφων</h1><button class="iconbtn" id="menu">⚙︎</button></div>
  <input class="search" id="q" placeholder="Αναζήτηση…" value="${esc(query)}"></header>
  <main>
  ${PROFILES.length>1?`<div class="chips">${chip('p','all','Όλοι',fProfile==='all')}${PROFILES.map(p=>chip('p',p,p,fProfile===p)).join('')}</div>`:''}
  ${usedTypes.length>1?`<div class="chips">${chip('t','all','Όλα',fType==='all')}${usedTypes.map(t=>chip('t',t,TYPES[t]?.n||t,fType===t)).join('')}</div>`:''}
  ${soon.length?`<div class="alert">⏰ ${soon.map(d=>`<b>${esc(d.title)}</b>: ${daysLeft(d.expiry)<0?'έληξε':'λήγει σε '+daysLeft(d.expiry)+' ημ.'}`).join('<br>⏰ ')}</div>`:''}
  ${items.length ? items.map(d=>{const t=TYPES[d.type]||TYPES.other; return `
    <div class="doc" data-id="${d.id}" style="background:linear-gradient(135deg,${t.g[0]},${t.g[1]})">
      <div class="t">${esc(t.n)}</div><div class="n">${esc(d.title||t.n)}</div>
      <div class="h">${esc(d.holder||'')}</div><div class="num">${esc(maskNum(d.number))}</div>${expiryBadge(d.expiry)}${d.photo?`<div class="thumb" style="background-image:url(${d.photo})"></div>`:''}
    </div>`}).join('') : `<div class="empty"><div class="big">🗂️</div>${DOCS.length?'Δεν βρέθηκε τίποτα.':'Δεν έχεις έγγραφα ακόμα.<br>Πάτα «Προσθήκη» για να ξεκινήσεις.'}</div>`}
  <p class="note">Προσωπική, κρυπτογραφημένη αποθήκευση στη συσκευή σου.<br>Δεν αποτελεί επίσημο έγγραφο και δεν συνδέεται με το Δημόσιο.</p></main>
  <button class="fab" id="add">＋ Προσθήκη</button>`;
  $('#q').oninput=e=>{ query=e.target.value; const p=e.target.selectionStart; renderList(); const i=$('#q'); i.focus(); i.setSelectionRange(p,p); };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{fProfile=b.dataset.p;renderList();});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{fType=b.dataset.t;renderList();});
  $('#add').onclick=()=>openForm();
  $('#menu').onclick=openSettings;
  document.querySelectorAll('.doc').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

/* ---------- sheet helper ---------- */
function sheet(title, html, rightBtn=''){
  const s=document.createElement('div'); s.className='sheet';
  s.innerHTML=`<header class="top"><div class="row"><button class="iconbtn" data-close>‹ Πίσω</button><h1>${esc(title)}</h1><span style="min-width:60px;text-align:right">${rightBtn}</span></div></header><div class="body">${html}</div>`;
  s.querySelector('[data-close]').onclick=()=>s.remove();
  document.body.appendChild(s); return s;
}

/* ---------- detail ---------- */
function openDetail(id){
  const d=DOCS.find(x=>x.id===id); if(!d) return; const t=TYPES[d.type]||TYPES.other;
  const kv=(k,v,copy)=>v?`<div class="kv"><small>${k}</small><div ${copy?`data-copy="${esc(v)}" style="cursor:pointer"`:''}>${esc(v)}</div></div>`:'';
  const s=sheet(d.title||t.n, `
    ${d.type==='academic'?`<div class="ahero"><div class="top2"><div><small>Κωδικός</small><div class="big">${esc(d.number||'—')}</div></div>${d.photo?`<div class="pic" style="background-image:url(${d.photo})"></div>`:''}</div>
      <div class="flds">${[['Όνομα',d.nameEl],['Επώνυμο',d.surnameEl],['Name',d.nameEn],['Surname',d.surnameEn],['Ακαδημαϊκή ιδιότητα',d.status],['Τμήμα / Ίδρυμα',d.institution]].filter(x=>x[1]).map(([k,v])=>`<div class="af"><small>${k}</small><div>${esc(v)}</div></div>`).join('')}</div>
      <div class="bd">${expiryBadge(d.expiry)}</div></div>`:`<div class="doc" style="background:linear-gradient(135deg,${t.g[0]},${t.g[1]});cursor:default">
      <div class="t">${esc(t.n)}</div><div class="n">${esc(d.title||t.n)}</div><div class="h">${esc(d.holder||'')}</div>
      <div class="num">${esc(d.number||'')}</div>${expiryBadge(d.expiry)}</div>`}
    ${kv('Αριθμός (πάτα για αντιγραφή)',d.number,true)}${kv('Κάτοχος',d.holder)}${kv('Έκδοση',d.issued&&new Date(d.issued).toLocaleDateString('el-GR'))}${kv('Λήξη',d.expiry&&new Date(d.expiry).toLocaleDateString('el-GR'))}${kv('Σημειώσεις',d.notes)}
    ${(d.front||d.back)?`<div class="flip" id="flip"><div class="fi"><div class="face" style="background-image:url(${d.front||d.back})"></div><div class="face back" style="background-image:url(${d.back||d.front})"></div></div></div><div class="hint">${d.front&&d.back?'Πάτα για αναστροφή · ':''}</div><button class="btn sec" id="full" style="margin-top:8px">🔍 Πλήρης οθόνη</button>`:''}
    ${d.expiry?'<button class="btn sec" id="ics">📅 Υπενθύμιση λήξης στο ημερολόγιο</button>':''}
    <button class="btn" id="edit">Επεξεργασία</button><button class="btn danger" id="del">Διαγραφή</button>`);
  s.querySelectorAll('[data-copy]').forEach(e=>e.onclick=()=>{navigator.clipboard?.writeText(e.dataset.copy); toast('Αντιγράφηκε');});
  const fl=$('#flip',s); if(fl) fl.onclick=()=>{ if(d.front&&d.back) fl.classList.toggle('on'); };
  const fu=$('#full',s); if(fu) fu.onclick=()=>{ const side=(fl.classList.contains('on')?d.back:d.front)||d.front||d.back; const w=document.createElement('div'); w.className='modal'; w.style.alignItems='center'; w.style.background='#000'; w.innerHTML=`<img src="${side}" style="max-width:100%;max-height:100%">`; w.onclick=()=>w.remove(); document.body.appendChild(w); };
  const ic=$('#ics',s); if(ic) ic.onclick=()=>exportICS(d);
  s.querySelector('#edit').onclick=()=>{ s.remove(); openForm(d); };
  s.querySelector('#del').onclick=()=>confirmBox('Διαγραφή εγγράφου;','Η ενέργεια δεν αναιρείται.','Διαγραφή',async()=>{ DOCS=DOCS.filter(x=>x.id!==id); await persist(); s.remove(); renderList(); toast('Διαγράφηκε'); });
}

async function exportICS(d){
  const dt=d.expiry.replace(/-/g,''); const nx=new Date(new Date(d.expiry).getTime()+864e5).toISOString().slice(0,10).replace(/-/g,'');
  const t=(d.title||'Έγγραφο').replace(/[,;\\\n]/g,' ');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Portofoli//EL','BEGIN:VEVENT',`UID:${d.id}@portofoli`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;VALUE=DATE:${dt}`,`DTEND;VALUE=DATE:${nx}`,`SUMMARY:Λήξη: ${t}`,
   'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:Λήξη σε 30 ημέρες: ${t}`,'TRIGGER:-P30D','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:Λήξη σε 7 ημέρες: ${t}`,'TRIGGER:-P7D','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const f=new File([ics],'lixi-eggrafou.ics',{type:'text/calendar'});
  try{ if(navigator.canShare?.({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ---------- form ---------- */
async function compress(file, max=1400){
  const bmp=await createImageBitmap(file); const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.8);
}
function openForm(d){
  const doc = d ? {...d} : {id:uid(), type:'id'};
  const s=sheet(d?'Επεξεργασία':'Νέο έγγραφο', `
    <label class="lbl">Τύπος</label><select class="inp" id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${doc.type===k?'selected':''}>${v.n}</option>`).join('')}</select>
    ${PROFILES.length>1?`<label class="lbl">Προφίλ</label><select class="inp" id="profile">${PROFILES.map(p=>`<option ${((doc.profile||PROFILES[0])===p)?'selected':''}>${esc(p)}</option>`).join('')}</select>`:''}
    <div id="acad" style="display:${doc.type==='academic'?'block':'none'}">
      <label class="lbl">Φωτογραφία προσώπου</label><div class="imgs"><div class="imgslot" id="sp" style="aspect-ratio:3/4">+ Φωτογραφία</div></div>
      <label class="lbl">Όνομα (ελληνικά)</label><input class="inp" id="nameEl" value="${esc(doc.nameEl||'')}">
      <label class="lbl">Επώνυμο (ελληνικά)</label><input class="inp" id="surnameEl" value="${esc(doc.surnameEl||'')}">
      <label class="lbl">Name (Latin)</label><input class="inp" id="nameEn" value="${esc(doc.nameEn||'')}">
      <label class="lbl">Surname (Latin)</label><input class="inp" id="surnameEn" value="${esc(doc.surnameEn||'')}">
      <label class="lbl">Ακαδημαϊκή ιδιότητα</label><input class="inp" id="status" value="${esc(doc.status||'')}" placeholder="π.χ. Προπτυχιακός">
      <label class="lbl">Τμήμα / Ίδρυμα</label><input class="inp" id="institution" value="${esc(doc.institution||'')}">
    </div>
    <label class="lbl">Τίτλος</label><input class="inp" id="title" value="${esc(doc.title||'')}" placeholder="π.χ. Ταυτότητα μου">
    <label class="lbl">Κάτοχος</label><input class="inp" id="holder" value="${esc(doc.holder||'')}">
    <label class="lbl">Αριθμός</label><input class="inp" id="number" value="${esc(doc.number||'')}" autocomplete="off">
    <label class="lbl">Ημερομηνία έκδοσης</label><input class="inp" type="date" id="issued" value="${esc(doc.issued||'')}">
    <label class="lbl">Ημερομηνία λήξης</label><input class="inp" type="date" id="expiry" value="${esc(doc.expiry||'')}">
    <label class="lbl">Σημειώσεις</label><textarea class="inp" id="notes" rows="3">${esc(doc.notes||'')}</textarea>
    <label class="lbl">Φωτογραφίες (μπρος / πίσω)</label><div class="imgs"><div class="imgslot" id="sf">+ Μπροστά</div><div class="imgslot" id="sb">+ Πίσω</div></div>
    <input type="file" accept="image/*" id="file" hidden>
    <button class="btn" id="save">Αποθήκευση</button>`);
  const file=$('#file',s); let target=null;
  function paint(){ [['front','sf','+ Μπροστά'],['back','sb','+ Πίσω'],['photo','sp','+ Φωτογραφία']].forEach(([k,id,l])=>{ const e=$('#'+id,s); if(doc[k]){ e.className='imgslot has'; e.style.backgroundImage=`url(${doc[k]})`; e.innerHTML=`<button class="x" data-rm="${k}">×</button>`; } else { e.className='imgslot'; e.style.backgroundImage=''; e.textContent=l; } }); }
  paint(); $('#type',s).onchange=e=>{ $('#acad',s).style.display=e.target.value==='academic'?'block':'none'; };
  s.addEventListener('click',e=>{ const rm=e.target.dataset?.rm; if(rm){ e.stopPropagation(); delete doc[rm]; paint(); return; } const sl=e.target.closest('.imgslot'); if(sl && !sl.classList.contains('has')){ target = sl.id==='sf'?'front':sl.id==='sp'?'photo':'back'; file.click(); } });
  file.onchange=async()=>{ if(file.files[0]&&target){ try{ doc[target]=await compress(file.files[0]); paint(); }catch(e){ toast('Αδυναμία ανάγνωσης εικόνας'); } } file.value=''; };
  $('#save',s).onclick=async()=>{
    Object.assign(doc,{type:$('#type',s).value,title:$('#title',s).value.trim(),holder:$('#holder',s).value.trim(),number:$('#number',s).value.trim(),issued:$('#issued',s).value,expiry:$('#expiry',s).value,notes:$('#notes',s).value.trim(),nameEl:$('#nameEl',s).value.trim(),surnameEl:$('#surnameEl',s).value.trim(),nameEn:$('#nameEn',s).value.trim(),surnameEn:$('#surnameEn',s).value.trim(),status:$('#status',s).value.trim(),institution:$('#institution',s).value.trim(),profile:$('#profile',s)?.value||doc.profile||PROFILES[0]});
    if(!doc.title) doc.title=TYPES[doc.type].n;
    const i=DOCS.findIndex(x=>x.id===doc.id); if(i>=0) DOCS[i]=doc; else DOCS.unshift(doc);
    await persist(); s.remove(); renderList(); toast('Αποθηκεύτηκε');
  };
}

/* ---------- modals / settings ---------- */
function confirmBox(title,msg,okLabel,fn){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3 style="margin:0 0 6px">${esc(title)}</h3><p style="color:var(--mute);margin:0">${esc(msg)}</p><button class="btn danger" id="ok">${esc(okLabel)}</button><button class="btn sec" id="no">Άκυρο</button></div>`;
  m.querySelector('#no').onclick=()=>m.remove(); m.querySelector('#ok').onclick=async()=>{ m.remove(); await fn(); };
  document.body.appendChild(m);
}
function askText(title,label,type,fn){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3 style="margin:0 0 6px">${esc(title)}</h3><label class="lbl">${esc(label)}</label><input class="inp" id="v" type="${type}" inputmode="numeric" autocomplete="off"><button class="btn" id="ok">OK</button><button class="btn sec" id="no">Άκυρο</button></div>`;
  m.querySelector('#no').onclick=()=>m.remove(); m.querySelector('#ok').onclick=async()=>{ const v=m.querySelector('#v').value; m.remove(); await fn(v); };
  document.body.appendChild(m);
}
function openSettings(){
  const s=sheet('Ρυθμίσεις', `
    <button class="btn" id="lock" style="margin-top:0">🔒 Κλείδωμα τώρα</button>
    <button class="btn sec" id="bio">${META.bio?'🔓 Απενεργοποίηση Face ID / δακτυλικού':'🔓 Ενεργοποίηση Face ID / δακτυλικού'}</button>
    <button class="btn sec" id="prof">👨‍👩‍👧 Προσθήκη προφίλ (π.χ. σύζυγος, παιδί)${PROFILES.length>1?' · '+esc(PROFILES.join(', ')):''}</button>
    <button class="btn sec" id="pin">🔑 Αλλαγή PIN</button>
    <button class="btn sec" id="exp">⬇︎ Εξαγωγή κρυπτογραφημένου αντιγράφου</button>
    <button class="btn sec" id="imp">⬆︎ Εισαγωγή αντιγράφου</button>
    <input type="file" id="impf" accept=".dwbackup,application/json" hidden>
    <button class="btn danger" id="wipe">Διαγραφή όλων των δεδομένων</button>
    <p class="note">Τα δεδομένα μένουν μόνο σε αυτή τη συσκευή, κρυπτογραφημένα (AES-256, κλειδί από το PIN σου). Κάνε τακτικά αντίγραφο ασφαλείας — αν χαθεί η συσκευή ή το PIN, δεν υπάρχει ανάκτηση.</p>`);
  $('#lock',s).onclick=lockNow;
  $('#bio',s).onclick=async()=>{
    if(META.bio){ delete META.bio; await DB.set('meta',META); s.remove(); toast('Απενεργοποιήθηκε'); return; }
    try{ await bioEnable(); s.remove(); toast('Ενεργοποιήθηκε'); }
    catch(e){ toast(e.message==='unsupported'||e.message==='noprf'?'Η συσκευή/ο browser δεν το υποστηρίζει (χρειάζεται iOS 18+ ή πρόσφατο Chrome)':'Ακυρώθηκε'); }
  };
  $('#prof',s).onclick=()=>askText('Νέο προφίλ','Όνομα','text',async v=>{ v=v.trim(); if(!v||PROFILES.includes(v)) return; PROFILES.push(v); await persist(); s.remove(); renderList(); toast('Προστέθηκε'); });
  $('#pin',s).onclick=()=>askText('Αλλαγή PIN','Νέο 6ψήφιο PIN','password',async v=>{
    if(!/^\d{6}$/.test(v)){ toast('Πρέπει να είναι 6 ψηφία'); return; }
    const salt=rnd(16); META.salt=salt; META.iter=ITER; META.wrapped=await wrapKey(await deriveKey(v,salt),KEY); await DB.set('meta',META); toast('Το PIN άλλαξε');
  });
  $('#exp',s).onclick=async()=>{
    const blob=await DB.get('vault');
    const out={v:2,salt:toB64(META.salt),iter:META.iter,wiv:toB64(META.wrapped.iv),wdata:toB64(META.wrapped.data),iv:toB64(blob.iv),data:toB64(blob.data)};
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download=`portofolio-backup-${new Date().toISOString().slice(0,10)}.dwbackup`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  };
  const f=$('#impf',s); $('#imp',s).onclick=()=>f.click();
  f.onchange=async()=>{
    const file=f.files[0]; if(!file) return;
    let b; try{ b=JSON.parse(await file.text()); if(!b.salt||!b.iv||!b.data) throw 0; }catch{ toast('Μη έγκυρο αρχείο'); return; }
    askText('Εισαγωγή','PIN που είχε το αντίγραφο','password',async pin=>{
      try{
        const k=await deriveKey(pin,fromB64(b.salt),b.iter);
        const mk=b.wdata?await unwrapKey(k,{iv:fromB64(b.wiv),data:fromB64(b.wdata)}):k;
        const v=await decryptJSON(mk,{iv:fromB64(b.iv),data:fromB64(b.data)});
        const have=new Set(DOCS.map(d=>d.id)); let n=0;
        for(const p of v.profiles||[]) if(!PROFILES.includes(p)) PROFILES.push(p);
        for(const d of v.docs||[]) if(!have.has(d.id)){ DOCS.push(d); n++; }
        await persist(); s.remove(); renderList(); toast(`Προστέθηκαν ${n} έγγραφα`);
      }catch{ toast('Λάθος PIN ή φθαρμένο αρχείο'); }
    });
  };
  $('#wipe',s).onclick=()=>confirmBox('Διαγραφή όλων;','Θα σβηστούν όλα τα έγγραφα και το PIN. Δεν αναιρείται.','Διαγραφή όλων',async()=>{ await DB.clear(); location.reload(); });
}

/* ---------- boot ---------- */
async function boot(){
  META=await DB.get('meta');
  await lockScreen(META?'unlock':'setup');
  lastActive=Date.now(); renderList();
}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>lastActive=Date.now(),{passive:true}));
setInterval(()=>{ if(KEY && Date.now()-lastActive>120000) lockNow(); },5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) window._hid=Date.now(); else if(KEY && window._hid && Date.now()-window._hid>30000) lockNow(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
